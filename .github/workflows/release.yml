name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA — a major tag can be repointed by whoever owns
      # the repository, and this job holds contents: write.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build Trilium import zip
        run: python3 build-zip.py "${{ github.ref_name }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: trilium-presenter-plugin.zip
          generate_release_notes: true
